<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 타인의 궤도 — The Isle of Orbits</title>
<meta name="description" content="프로젝트 타인의 궤도 — a performing arts project exploring the boundaries between self and other.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<style>
  :root{
    --bg-light: #E7E5DF;
    --bg-dark:  #232220;
    --ink:      #17150F;
    --cream:    #EFEDE6;
    --line:     #a6a49b;
    --line-soft: rgba(166,164,155,0.55);
    --dot:      #17150F;
    --dot-cream:#EFEDE6;
    --font-kr:  'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-jp:  'M PLUS Rounded 1c', 'Pretendard', sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family: var(--font-kr);
    background: var(--bg-dark);
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
  }
  body.lang-jp .i18n, body.lang-jp .i18n *{ font-family: var(--font-jp); letter-spacing:0; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }

  a{ color:inherit; }

  /* ---------- grain texture ---------- */
  .grain{
    position:absolute; inset:0; pointer-events:none;
    opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------- language switcher ---------- */
  .lang-switch{
    position:fixed; top:22px; right:22px; z-index:50;
    display:flex; gap:6px;
    background:rgba(23,21,15,0.35);
    backdrop-filter: blur(6px);
    border-radius:999px;
    padding:5px;
  }
  body.on-light .lang-switch{ background:rgba(255,255,255,0.4); }
  .lang-btn{
    font-family: var(--font-kr);
    font-size:12px; font-weight:700; letter-spacing:.02em;
    padding:7px 13px; border-radius:999px; border:none;
    background:transparent; color:inherit; cursor:pointer;
    opacity:.55; transition: opacity .25s var(--ease), background .25s var(--ease);
  }
  .lang-btn.active{ opacity:1; background:var(--ink); color:var(--cream); }
  body.on-light .lang-btn.active{ background:var(--ink); color:var(--bg-light); }
  .lang-btn:focus-visible{ outline:2px solid currentColor; outline-offset:2px; }

  /* ---------- section shells ---------- */
  section{
    position:relative;
    width:100%;
    padding: clamp(90px,14vw,160px) clamp(24px,7vw,120px);
  }
  .dark{ background:var(--bg-dark); color:var(--cream); }
  .light{ background:var(--bg-light); color:var(--ink); }

  .inner{ max-width:900px; margin:0 auto; position:relative; z-index:2; }

  /* ---------- reveal ---------- */
  .reveal{ opacity:0; transform:translateY(24px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in-view{ opacity:1; transform:translateY(0); }
  .reveal.d1{ transition-delay:.08s; }
  .reveal.d2{ transition-delay:.16s; }

  /* ---------- COVER ---------- */
  .cover{
    min-height:100svh;
    display:flex; flex-direction:column; justify-content:center;
    background:var(--bg-light); color:var(--ink);
    overflow:hidden;
  }
  .cover .arc{
    position:absolute; top:-18vw; left:-12vw;
    width:min(1000px,140vw); height:auto; opacity:.55;
  }
  .cover .arc path{ fill:none; stroke:var(--line); stroke-width:1.4; }
  .cover .arc circle{ fill:var(--dot); }
  .cover-title{
    position:relative; z-index:2;
    font-weight:900; line-height:0.98; letter-spacing:-.01em;
    font-size: clamp(44px, 9vw, 92px);
  }
  .cover-title span{ display:block; }
  .cover-ghost{
    font-family: var(--font-jp);
    position:relative; z-index:1;
    margin-top:clamp(14px,3vw,26px);
    color: var(--line);
    font-weight:500;
    line-height:1.18;
    font-size: clamp(24px, 5vw, 46px);
  }
  .cover-ghost span{ display:block; }
  .cover-sub{
    margin-top:clamp(30px,5vw,54px);
    font-size:14px; font-weight:600; letter-spacing:.03em;
    color:#6b6960;
    max-width:32ch;
  }
  .scroll-cue{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:#8a887e; display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .scroll-cue .stem{ width:1px; height:30px; background:linear-gradient(var(--line), transparent); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

  /* ---------- DECK (dark text sections) ---------- */
  .tag{
    display:inline-block;
    font-family: var(--font-kr);
    font-weight:800; font-size:15px; letter-spacing:.02em;
    color:var(--cream);
    margin-bottom: clamp(28px,5vw,46px);
    position:relative; padding-left:18px;
  }
  .tag::before{
    content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:9px; height:9px; border-radius:50%; background:var(--cream);
  }

  .question{
    font-weight:800; line-height:1.28; letter-spacing:-.01em;
    font-size: clamp(26px, 4.6vw, 44px);
    white-space:pre-line;
    max-width: 15ch;
  }
  body.lang-jp .question{ max-width:18ch; line-height:1.35; }
  body.lang-en .question{ max-width:16ch; }

  .statement{ margin-top:clamp(64px,9vw,110px); display:flex; flex-direction:column; gap:1.9em; }
  .statement p{
    font-size: clamp(16px, 2.1vw, 19px);
    line-height:1.72;
    color: #cfccc2;
    max-width:56ch;
  }

  .isle-intro{
    font-weight:600;
    font-size: clamp(20px, 3.4vw, 30px);
    line-height:1.5; white-space:pre-line;
    max-width: 24ch;
    color: var(--cream);
  }

  .isle-h2{
    font-weight:800; line-height:1.14; letter-spacing:-.01em;
    font-size: clamp(32px, 6.4vw, 62px);
    white-space:pre-line;
  }
  .isle-paras{ margin-top:clamp(40px,6vw,64px); display:flex; flex-direction:column; gap:1.6em; }
  .isle-paras p{
    font-size: clamp(15px,1.9vw,18px); line-height:1.7; color:#cfccc2; max-width:52ch;
  }
  .isle-paras p:first-child{ padding-top:1.6em; border-top:1px solid rgba(239,237,230,0.14); }

  .term-title{
    font-weight:900; font-size: clamp(38px,7vw,64px); letter-spacing:-.01em;
  }
  .term-paras{ margin-top:clamp(36px,5vw,54px); display:flex; flex-direction:column; gap:1.5em; }
  .term-paras p{ font-size: clamp(15px,1.8vw,17px); line-height:1.75; color:#c3c0b6; max-width:58ch; }

  /* ---------- ORBIT ILLUSTRATION ---------- */
  .hero-illustration{
    background:var(--bg-light); color:var(--ink);
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:clamp(28px,5vw,48px);
  }
  .orbit-figure{ width:min(560px,86vw); height:auto; }
  .orbit-figure .ring{ fill:none; stroke:var(--ink); stroke-width:1.3; opacity:.85; }
  .orbit-figure .ring.soft{ opacity:.45; }
  .orbit-figure .node{ fill:var(--ink); }
  .orbit-figure .node.hollow{ fill:none; stroke:var(--ink); stroke-width:1.4; }
  .orbit-figure .walker{ fill:var(--ink); }
  .orbit-figure .rot{ transform-origin: 260px 210px; animation: spin 90s linear infinite; animation-play-state:paused; }
  .orbit-figure .rot.rev{ animation-direction:reverse; animation-duration:120s; }
  .hero-illustration.play .orbit-figure .rot{ animation-play-state:running; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .orbit-stage{
    display:inline-block;
    opacity:0;
    transform: rotate(-58deg) scale(.86);
    transition: opacity 1.1s var(--ease), transform 1.5s var(--ease);
  }
  .hero-illustration.play .orbit-stage{
    opacity:1;
    transform: rotate(0deg) scale(1);
  }

  .hero-caption{ display:flex; flex-direction:column; gap:6px; }
  .hero-caption{
    opacity:0;
    transform:translateY(16px);
    transition: opacity .8s var(--ease), transform .8s var(--ease);
  }
  .hero-caption.show{ opacity:1; transform:translateY(0); }
  .hero-caption .kr{ font-weight:800; font-size:clamp(20px,3.6vw,30px); }
  .hero-caption .en{ font-family:'Pretendard'; font-weight:500; font-size:clamp(13px,2vw,16px); letter-spacing:.04em; color:#6b6960; }
  @media (prefers-reduced-motion: reduce){
    .orbit-stage{ opacity:1; transform:none; }
    .hero-caption{ opacity:1; transform:none; }
    .orbit-figure .rot{ animation-play-state:running; }
  }

  /* ---------- DIVIDER (isle title card) ---------- */
  .divider{
    background:var(--bg-light); color:var(--ink);
    min-height:100svh; display:flex; align-items:center;
    overflow:hidden;
  }
  .divider .arcwrap{ position:absolute; left:-14vw; top:10%; width:min(760px,110vw); opacity:.9; }
  .divider .arcwrap path{ fill:none; stroke:var(--line); stroke-width:1.3; }
  .divider .arcwrap circle{ fill:none; stroke:var(--line); stroke-width:1.3; }
  .divider-text{ position:relative; z-index:2; margin-left:auto; text-align:right; padding-right:clamp(8px,4vw,40px); }
  .divider-ghost{ color:var(--line); font-weight:500; line-height:1.15; font-size:clamp(22px,4.6vw,40px); }
  .divider-ghost span{ display:block; }
  .divider-title{ margin-top:14px; font-weight:900; line-height:0.98; font-size:clamp(34px,7.4vw,70px); }
  .divider-title span{ display:block; }

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--bg-dark); color:#8a887e;
    padding: clamp(50px,8vw,90px) clamp(24px,7vw,120px);
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:20px;
    border-top:1px solid rgba(239,237,230,0.1);
  }
  footer .mark{ color:var(--cream); font-weight:800; font-size:15px; }
  footer .mark .sub{ display:block; font-weight:500; font-size:12px; color:#6f6d64; margin-top:4px; }
  footer .foot-links{ display:flex; gap:18px; font-size:13px; }
  footer .foot-links a{ text-decoration:none; opacity:.7; transition:opacity .2s; }
  footer .foot-links a:hover{ opacity:1; }

  /* ---------- scroll orbit tracker ---------- */
  .tracker{
    position:fixed; right:20px; bottom:20px; z-index:40;
    width:64px; height:64px; opacity:.85;
    pointer-events:none;
  }
  .tracker .path{ fill:none; stroke:currentColor; stroke-width:1; opacity:.4; }
  .tracker .dot{ fill:currentColor; }
  .tracker-dark{ color:var(--cream); }
  .tracker-light{ color:var(--ink); }
  @media (max-width:640px){ .tracker{ display:none; } }

  @media (max-width:640px){
    .lang-switch{ top:14px; right:14px; }
    section{ padding-left:20px; padding-right:20px; }
  }
</style>
</head>
<body class="lang-en on-light" data-lang="en">

<nav class="lang-switch" role="group" aria-label="Language">
  <button class="lang-btn" data-lang="kr">KR</button>
  <button class="lang-btn" data-lang="en">EN</button>
  <button class="lang-btn" data-lang="jp">日本語</button>
</nav>

<!-- ===================== COVER ===================== -->
<section class="cover" id="cover">
  <div class="grain"></div>
  <svg class="arc" viewBox="0 0 700 900" aria-hidden="true">

</section>

<!-- ===================== ORBIT CHAPTER ===================== -->
<section class="dark" id="orbit-chapter">
  <div class="grain"></div>
  <div class="inner">
    <span class="tag reveal">orbit.</span>

  </div>
</section>

<!-- ===================== ORBIT ILLUSTRATION (fixed lockup) ===================== -->
<section class="hero-illustration" id="hero-illustration">
  <div class="grain"></div>
  <div class="orbit-stage">
    <svg class="orbit-figure" viewBox="0 0 520 420" aria-hidden="true">
      <g class="rot">
        <ellipse class="ring" cx="260" cy="210" rx="230" ry="140" transform="rotate(-18 260 210)"/>

  <div class="hero-caption" id="heroCaption">

  </div>
</section>

<!-- ===================== DIVIDER (fixed EN/FR lockup) ===================== -->
<section class="divider">
  <div class="grain"></div>
  <svg class="arcwrap" viewBox="0 0 700 700" aria-hidden="true">
    <circle cx="500" cy="120" r="26"/>
    <path d="M -80 260 C 160 60, 480 40, 700 220"/>
    <path d="M -80 500 C 220 620, 520 560, 700 340"/>
  </svg>
  <div class="divider-text">
    <div class="divider-ghost"><span>L'Île</span><span>des</span><span>Orbites</span></div>
    <div class="divider-title"><span>The Isle</span><span>Of</span><span>Orbits</span></div>
  </div>
</section>

<!-- ===================== ISLE CHAPTER ===================== -->
<section class="dark" id="isle-chapter">
  <div class="grain"></div>
  <div class="inner">
    <span class="tag reveal">isle.</span>
    <p class="isle-intro i18n reveal d1" data-i18n="isleIntro"></p>
  </div>
</section>

<section class="dark">
  <div class="grain"></div>
  <div class="inner">
    <h2 class="isle-h2 i18n reveal" data-i18n="isleHeadline2"></h2>
    <div class="isle-paras i18n reveal d1" data-i18n-paras="isleParas2"></div>
  </div>
</section>

<section class="dark">
  <div class="grain"></div>
  <div class="inner">
    <h3 class="term-title i18n reveal" data-i18n="termTitle"></h3>
    <div class="term-paras i18n reveal d1" data-i18n-paras="termParas"></div>
  </div>
</section>

<footer>
  <div class="mark">타인의 궤도<span class="sub i18n" data-i18n="footTag"></span></div>
  <div class="foot-links">
    <a href="#cover" class="i18n" data-i18n="footTop">↑ Top</a>
  </div>
</footer>

<svg class="tracker tracker-dark" viewBox="0 0 70 70" aria-hidden="true">
  <ellipse class="path" cx="35" cy="35" rx="30" ry="18"/>
  <circle class="dot" id="trackerDot" cx="65" cy="35" r="3.4"/>
</svg>

<script>
(function(){
  const translations = {
    kr: {
      coverSub: "공연 예술 프로젝트 — 예술적 상상과 철학적 사유, 과학적 접근으로 ‘나’와 ‘타인’의 궤도를 탐구한다.",
      question: "인간인 우리는\n나 이외의 존재를\n어떻게 만나고,\n이해하고, 오해하고,\n관계 맺고 있는가?",
      statementParas: [

      ],
      isleIntro: "각자의 섬에서 각자의 궤도를 살아가는 존재들이\n서로의 궤도와 만나는 우주",
      isleHeadline2: "우리는 모두\n타인의 궤도를\n돌고 있다",

        "프로젝트 타궤는 서로 다른 섬에서 각자의 궤도를 살아가는 존재들의 섬우주이다."
      ],
      termTitle: "섬우주",

      ],
      footTag: "Project · The Isle of Orbits",

    en: {

    jp: {
      coverSub: "舞台芸術プロジェクト —「私」と「他者」の境界を、芸術・哲学・科学のアプローチで探る。",
      question: "人間である我々は、\n他者とどのように\n出会い、\n理解し、\n誤解し、\n関わっているのか?",
      statementParas: [
        "プロジェクト<他人の軌道>は、芸術的想像、哲学的思索、そして科学的アプローチを通して、「我」と「他者」の間に生じる境界と衝突を探究し、それを舞台上で問いかける公演芸術プロジェクトである。",
        "物語の登場人物たちも、それぞれの軌道を生きている。それぞれの速度で動いていた人生には、ある時、亀裂が生じる。葛藤と衝突は人物の軌道に力を加え、それまでの軌道を変化させたり、そこから離脱させたりする。その亀裂から、物語が始まる。",
        "プロジェクト<他人の軌道>は、「我」と「他者」の軌道が交差する瞬間に生まれる変化に注目しながら、異なる存在同士が一つの宇宙をつくっていくあり方を問い続ける。"
      ],
      isleIntro: "それぞれの島でそれぞれの軌道を生きる存在たちが\n互いの軌道を交わらせる宇宙",
      isleHeadline2: "私たちは\nみんな\n他人の軌道を\n回っている",
      isleParas2: [
        "それぞれの中心を持って近づいたり遠ざかったり、時にはぶつかったり離れたりする。",
        "プロジェクト<他軌>はそれぞれの島でそれぞれの軌道を生きる存在たちの「島宇宙」である。"
      ],
      termTitle: "島宇宙",
      termParas: [
        "カントが1755年に発表した論文の中で、宇宙には星の集団があちこちに散在しており、その一つ一つを大海原に浮かぶ小さな島に喩えたことに由来する言葉で、現代では「銀河」と呼ばれている。",
        "日本の社会学者で映画評論家でもある宮台真司は、カントの「島宇宙」という言葉に注目し、似た価値観を持つ人々が互いに集まり、他者と干渉しないようにする現象を「島宇宙化」と再解釈した。"
      ],
      footTag: "プロジェクト・他人の軌道",
      footTop: "↑ トップへ"
    }
  };

  function applyLang(lang){
    if(!translations[lang]) lang = 'en';
    const t = translations[lang];
    document.documentElement.lang = lang === 'kr' ? 'ko' : (lang === 'jp' ? 'ja' : 'en');
    document.body.dataset.lang = lang;
    document.body.classList.toggle('lang-jp', lang === 'jp');
    document.body.classList.toggle('lang-en', lang === 'en');

    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.textContent = t[key];
    });
    document.querySelectorAll('[data-i18n-paras]').forEach(el=>{
      const key = el.getAttribute('data-i18n-paras');
      if (t[key]) el.innerHTML = t[key].map(p => '<p>' + p + '</p>').join('');
    });
    document.querySelectorAll('.lang-btn').forEach(b=>{
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    try { localStorage.setItem('orbit-lang', lang); } catch(e){}
  }

  function detectLang(){
    let saved = null;
    try { saved = localStorage.getItem('orbit-lang'); } catch(e){}
    if (saved && translations[saved]) return saved;
    const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    if (nav.startsWith('ko')) return 'kr';
    if (nav.startsWith('ja')) return 'jp';
    return 'en';
  }

  applyLang(detectLang());

  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.addEventListener('click', ()=> applyLang(b.getAttribute('data-lang')));
  });

  // reveal on scroll
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in-view'); } });
  }, { threshold: 0.18 });
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

  // hero illustration: orbits spin in first, caption follows
  (function(){
    const stageSection = document.getElementById('hero-illustration');
    const caption = document.getElementById('heroCaption');
    if(!stageSection || !caption) return;
    let captionTimer = null;
    const heroIO = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          stageSection.classList.add('play');
          clearTimeout(captionTimer);
          captionTimer = setTimeout(()=> caption.classList.add('show'), 1200);
        } else {
          stageSection.classList.remove('play');
          caption.classList.remove('show');
          clearTimeout(captionTimer);
        }
      });
    }, { threshold: 0.4 });
    heroIO.observe(stageSection);
  })();

  // light/dark aware bits (lang switch contrast + tracker color)
  const lightSections = document.querySelectorAll('.cover, .hero-illustration, .divider');
  const darkSections = document.querySelectorAll('section.dark');
  const tracker = document.getElementById('trackerDot');
  const trackerSvg = document.querySelector('.tracker');
  const bodyEl = document.body;

  const sectionObserver = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting && e.intersectionRatio > 0.5){
        const isLight = e.target.classList.contains('cover') || e.target.classList.contains('hero-illustration') || e.target.classList.contains('divider');
        bodyEl.classList.toggle('on-light', isLight);
        trackerSvg.classList.toggle('tracker-light', isLight);
        trackerSvg.classList.toggle('tracker-dark', !isLight);
      }
    });
  }, { threshold: [0.5] });
  document.querySelectorAll('section').forEach(s=>sectionObserver.observe(s));

  // scroll-linked orbit tracker dot
  let ticking = false;
  function updateTracker(){
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const p = max > 0 ? window.scrollY / max : 0;
    const angle = p * Math.PI * 2 - Math.PI / 2;
    const cx = 35, cy = 35, rx = 30, ry = 18;
    const x = cx + rx * Math.cos(angle);
    const y = cy + ry * Math.sin(angle);
    tracker.setAttribute('cx', x.toFixed(2));
    tracker.setAttribute('cy', y.toFixed(2));
    ticking = false;
  }
  window.addEventListener('scroll', ()=>{
    if(!ticking){ requestAnimationFrame(updateTracker); ticking = true; }
  }, { passive: true });
  updateTracker();
})();
</script>
</body>
